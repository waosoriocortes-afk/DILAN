<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller - Control de Trabajos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1e20;--panel:#262a2d;--panel-2:#2f3336;--line:#3a3f43;--text:#eeeae2;
    --muted:#9a9d9f;--amber:#e8a33d;--amber-dim:#6b4f1f;--blue:#5b8fb0;--green:#6f9d6f;--red:#c1615a;--red-dim:#4a2c2a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  #login-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
  .login-header{margin-bottom:28px;}
  .login-header .tag{display:inline-block;background:var(--amber);color:#1c1e20;font-weight:700;font-size:11px;padding:3px 8px;letter-spacing:0.08em;margin-bottom:12px;}
  .login-header h1{font-size:30px;font-weight:600;line-height:1.1;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 12px;font-size:15px;font-family:inherit;border-radius:2px;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--amber);}
  .btn{display:inline-block;background:var(--amber);color:#1c1e20;border:none;padding:13px 18px;font-weight:600;font-size:14px;cursor:pointer;border-radius:2px;font-family:'IBM Plex Sans',sans-serif;width:100%;margin-top:6px;}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.ghost{background:transparent;border:none;color:var(--muted);font-size:13px;text-decoration:underline;width:auto;padding:6px 0;}
  .error-msg{color:var(--red);font-size:13px;margin-top:8px;min-height:16px;}
  .demo-note{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;}
  #topbar{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5;}
  #topbar .who{font-size:13px;}
  #topbar .who .name{font-weight:600;}
  #topbar .who .role{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;}
  #topbar button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 10px;font-size:12px;border-radius:2px;cursor:pointer;}
  #tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{flex:1;text-align:center;padding:13px 6px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;}
  .tab.active{color:var(--text);border-bottom-color:var(--amber);}
  .tab-badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px;margin-left:2px;}
  #content{flex:1;padding:16px;padding-bottom:90px;}
  .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .ticket{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:2px;padding:14px;margin-bottom:10px;position:relative;}
  .ticket.pendiente{border-left-color:var(--amber);}
  .ticket.en_proceso{border-left-color:var(--blue);}
  .ticket.estancado{border-left-color:var(--red);}
  .ticket.terminado{border-left-color:var(--green);}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .ticket-id{font-size:11px;color:var(--muted);}
  .ticket-estado{font-size:10px;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
  .ticket-estado.pendiente{background:var(--amber-dim);color:var(--amber);}
  .ticket-estado.en_proceso{background:#2c3f4a;color:var(--blue);}
  .ticket-estado.estancado{background:var(--red-dim);color:var(--red);}
  .ticket-estado.terminado{background:#2e3d2e;color:var(--green);}
  .ticket h3{font-size:17px;font-weight:600;margin-bottom:4px;}
  .ticket .meta{font-size:12.5px;color:var(--muted);line-height:1.6;}
  .ticket .meta b{color:var(--text);font-weight:500;}
  .ticket-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .ticket-actions button{flex:1;min-width:100px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px;font-size:12px;border-radius:2px;cursor:pointer;}
  .ticket-actions button.primary{background:var(--amber);color:#1c1e20;border:none;font-weight:600;}
  .empty-state{color:var(--muted);font-size:13px;padding:30px 10px;text-align:center;
