<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletas de Dilan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos de Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Comic Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #e0f2fe;
        }
        .btn-burbuja {
            transition: transform 0.1s ease-in-out;
        }
        .btn-burbuja:active {
            transform: scale(0.95);
        }
        /* Scrollbar personalizada y fina */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const formatearPlata = (valor) => {
            if (valor === undefined || valor === null) return "0";
            return Number(valor).toLocaleString('es-CO');
        };

        const HELADOS_INICIALES = [
            { id: '1', nombre: 'Frutos rojos', emoji: '🍓', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-red-400' },
            { id: '2', nombre: 'Arequipe', emoji: '🍮', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-orange-300' },
            { id: '3', nombre: 'Mandarina', emoji: '🍊', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-orange-400' },
            { id: '4', nombre: 'Chicle', emoji: '🍬', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-pink-300' },
            { id: '5', nombre: 'Uva', emoji: '🍇', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-purple-400' },
            { id: '6', nombre: 'Piña', emoji: '🍍', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-yellow-400' },
            { id: '7', nombre: 'Coco', emoji: '🥥', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-slate-100' },
            { id: '8', nombre: 'Limón', emoji: '🍋', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-green-400' },
            { id: '9', nombre: 'Chocolate', emoji: '🍫', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-amber-700' },
            { id: '10', nombre: 'Maracuyá', emoji: '🟡', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-yellow-500' },
            { id: '11', nombre: 'Mora brownie', emoji: '🫐', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-purple-600' },
            { id: '12', nombre: 'Mango biche', emoji: '🥭', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-green-300' },
            { id: '13', nombre: 'Bom Bom Bum', emoji: '🍭', precioVenta: 1500, costoCompra: 700, stock: 10, color: 'bg-red-500' }
        ];

        function App() {
            // --- PERSISTENCIA: Cargar datos de LocalStorage ---
            const [inventario, setInventario] = useState(() => {
                const save = localStorage.getItem('dilan_inv');
                return save ? JSON.parse(save) : HELADOS_INICIALES;
            });
            const [historialVentas, setHistorialVentas] = useState(() => {
                const save = localStorage.getItem('dilan_ventas');
                return save ? JSON.parse(save) : [];
            });
            const [historialCompras, setHistorialCompras] = useState(() => {
                const save = localStorage.getItem('dilan_compras');
                return save ? JSON.parse(save) : [];
            });
            const [historialRetiros, setHistorialRetiros] = useState(() => {
                const save = localStorage.getItem('dilan_retiros');
                return save ? JSON.parse(save) : [];
            });

            const [pantallaActual, setPantallaActual] = useState('vender');

            // --- GUARDAR AUTOMÁTICAMENTE ---
            useEffect(() => {
                localStorage.setItem('dilan_inv', JSON.stringify(inventario));
                localStorage.setItem('dilan_ventas', JSON.stringify(historialVentas));
                localStorage.setItem('dilan_compras', JSON.stringify(historialCompras));
                localStorage.setItem('dilan_retiros', JSON.stringify(historialRetiros));
            }, [inventario, historialVentas, historialCompras, historialRetiros]);

            // --- LÓGICA DE VENTAS ---
            const [carritoVenta, setCarritoVenta] = useState([]);
            const [pagoRecibido, setPagoRecibido] = useState('');
            const [descuento, setDescuento] = useState('');
            const [mostrarVueltas, setMostrarVueltas] = useState(false);

            const agregarAlCarrito = (helado) => {
                const itemEnCarrito = carritoVenta.find(item => item.id === helado.id);
                const productoInventario = inventario.find(p => p.id === helado.id);
                
                if (itemEnCarrito) {
                    if (itemEnCarrito.cantidad < productoInventario.stock) {
                        setCarritoVenta(carritoVenta.map(item => 
                            item.id === helado.id ? { ...item, cantidad: item.cantidad + 1 } : item
                        ));
                    } else {
                        alert(`¡Ups! Solo quedan ${productoInventario.stock} paletas.`);
                    }
                } else {
                    if (productoInventario.stock > 0) {
                        setCarritoVenta([...carritoVenta, { ...helado, cantidad: 1 }]);
                    } else {
                         alert(`¡Se acabaron las de ${helado.nombre}!`);
                    }
                }
            };

            const quitarDelCarrito = (idHelado) => {
                const itemEnCarrito = carritoVenta.find(item => item.id === idHelado);
                if (itemEnCarrito.cantidad > 1) {
                    setCarritoVenta(carritoVenta.map(item => 
                        item.id === idHelado ? { ...item, cantidad: item.cantidad - 1 } : item
                    ));
                } else {
                    setCarritoVenta(carritoVenta.filter(item => item.id !== idHelado));
                }
            };

            const subtotalVenta = carritoVenta.reduce((total, item) => total + (item.precioVenta * item.cantidad), 0);
            const valorDescuento = parseInt(descuento || 0);
            const totalVenta = Math.max(0, subtotalVenta - valorDescuento);
            const vueltas = parseInt(pagoRecibido || 0) - totalVenta;

            const confirmarVenta = () => {
                const nuevoInventario = inventario.map(producto => {
                    const itemVendido = carritoVenta.find(item => item.id === producto.id);
                    return itemVendido ? { ...producto, stock: producto.stock - itemVendido.cantidad } : producto;
                });
                
                const nuevaVenta = { id: Date.now(), items: [...carritoVenta], total: totalVenta };
                setInventario(nuevoInventario);
                setHistorialVentas([...historialVentas, nuevaVenta]);
                setCarritoVenta([]);
                setPagoRecibido(''); setDescuento(''); setMostrarVueltas(false);
                alert('¡Venta cobrada! 💰');
            };

            // --- LÓGICA DE COMPRAS ---
            const [carritoCompra, setCarritoCompra] = useState([]);
            const agregarAlCarritoCompra = (helado) => {
                const item = carritoCompra.find(i => i.id === helado.id);
                if (item) {
                    setCarritoCompra(carritoCompra.map(i => i.id === helado.id ? { ...i, cantidad: i.cantidad + 1 } : i));
                } else {
                    setCarritoCompra([...carritoCompra, { ...helado, cantidad: 1 }]);
                }
            };

            const quitarDelCarritoCompra = (id) => {
                const item = carritoCompra.find(i => i.id === id);
                if (item.cantidad > 1) {
                    setCarritoCompra(carritoCompra.map(i => i.id === id ? { ...i, cantidad: i.cantidad - 1 } : i));
                } else {
                    setCarritoCompra(carritoCompra.filter(i => i.id !== id));
                }
            };

            const totalCompra = carritoCompra.reduce((total, item) => total + (item.costoCompra * item.cantidad), 0);

            const confirmarCompra = () => {
                const nuevoInventario = inventario.map(p => {
                    const item = carritoCompra.find(i => i.id === p.id);
                    return item ? { ...p, stock: p.stock + item.cantidad } : p;
                });
                setInventario(nuevoInventario);
                setHistorialCompras([...historialCompras, { id: Date.now(), total: totalCompra }]);
                setCarritoCompra([]);
                alert('¡Nevera llena! 🧊');
            };

            // --- EDICIÓN Y NUEVOS SABORES ---
            const [saborEditando, setSaborEditando] = useState(null);
            const [preciosEditados, setPreciosEditados] = useState({ precioVenta: '', costoCompra: '' });
            const [mostrarFormNuevo, setMostrarFormNuevo] = useState(false);
            const [nuevoSabor, setNuevoSabor] = useState({ nombre: '', emoji: '🍧', precioVenta: '', costoCompra: '' });

            const guardarEdicion = (id) => {
                setInventario(inventario.map(h => h.id === id ? { ...h, precioVenta: parseInt(preciosEditados.precioVenta), costoCompra: parseInt(preciosEditados.costoCompra) } : h));
                setSaborEditando(null);
            };

            const handleAgregarSabor = (e) => {
                e.preventDefault();
                const nuevaPaleta = { ...nuevoSabor, id: Date.now().toString(), stock: 0, color: 'bg-blue-300', precioVenta: parseInt(nuevoSabor.precioVenta), costoCompra: parseInt(nuevoSabor.costoCompra) };
                setInventario([...inventario, nuevaPaleta]);
                setMostrarFormNuevo(false);
                setNuevoSabor({ nombre: '', emoji: '🍧', precioVenta: '', costoCompra: '' });
            };

            // --- RETIROS ---
            const [mostrarFormRetiro, setMostrarFormRetiro] = useState(false);
            const [retiro, setRetiro] = useState({ monto: '', motivo: '' });

            // --- MÉTRICAS ---
            const metricas = useMemo(() => {
                const ingresos = historialVentas.reduce((t, v) => t + v.total, 0);
                const gastos = historialCompras.reduce((t, c) => t + c.total, 0);
                const retiros = historialRetiros.reduce((t, r) => t + r.monto, 0);
                const gananciaTotal = ingresos - gastos;
                
                let ventasPorProd = {};
                inventario.forEach(p => ventasPorProd[p.id] = { ...p, cantidadVendida: 0, ingresos: 0 });
                historialVentas.forEach(v => {
                    v.items.forEach(item => {
                        if(ventasPorProd[item.id]) {
                            ventasPorProd[item.id].cantidadVendida += item.cantidad;
                            ventasPorProd[item.id].ingresos += (item.precioVenta * item.cantidad);
                        }
                    });
                });

                return { ingresos, gastos, retiros, plataEnCaja: gananciaTotal - retiros, ventasPorProducto: Object.values(ventasPorProd) };
            }, [historialVentas, historialCompras, historialRetiros, inventario]);

            const borrarTodo = () => {
                if(confirm("¿Dilan, quieres borrar todo y empezar de cero?")) {
                    localStorage.clear();
                    window.location.reload();
                }
            };

            // --- RENDERIZADO DE VISTAS ---
            const renderVender = () => (
                <div className="flex flex-col lg:flex-row gap-6 p-4">
                    <div className="flex-1 bg-white p-6 rounded-3xl shadow-xl border-4 border-cyan-300">
                        <h2 className="text-3xl font-bold text-cyan-600 mb-6 text-center">🍦 ¡A Vender Paletas!</h2>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            {inventario.map(helado => (
                                <button key={helado.id} onClick={() => agregarAlCarrito(helado)} 
                                    className={`btn-burbuja flex flex-col items-center p-3 rounded-2xl border-4 ${helado.stock > 0 ? 'border-cyan-100 bg-cyan-50 hover:bg-cyan-100' : 'opacity-50 grayscale cursor-not-allowed border-gray-200'}`}
                                    disabled={helado.stock === 0}>
                                    <span className="text-5xl mb-1">{helado.emoji}</span>
                                    <span className="font-bold text-gray-800">{helado.nombre}</span>
                                    <span className="text-cyan-600 font-bold">${formatearPlata(helado.precioVenta)}</span>
                                    <span className="text-xs text-gray-400">Stock: {helado.stock}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="w-full lg:w-96 bg-blue-50 p-6 rounded-3xl shadow-xl border-4 border-blue-300">
                        <h2 className="text-2xl font-bold text-blue-600 mb-4 text-center">🛒 Carrito</h2>
                        <div className="bg-white rounded-xl p-3 border-2 border-blue-100 min-h-[150px] mb-4">
                            {carritoVenta.length === 0 ? <p className="text-center text-gray-400 pt-10">Vacío...</p> : 
                                carritoVenta.map(item => (
                                    <div key={item.id} className="flex justify-between items-center mb-2 pb-2 border-b border-gray-50">
                                        <span className="text-sm font-bold">{item.emoji} {item.nombre}</span>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => quitarDelCarrito(item.id)} className="bg-red-100 text-red-600 w-6 h-6 rounded-full font-bold">-</button>
                                            <span className="w-4 text-center font-bold">{item.cantidad}</span>
                                            <button onClick={() => agregarAlCarrito(item)} className="bg-green-100 text-green-600 w-6 h-6 rounded-full font-bold">+</button>
                                        </div>
                                    </div>
                                ))
                            }
                        </div>
                        <div className="space-y-2 text-lg font-bold text-gray-700">
                            <div className="flex justify-between"><span>Total:</span> <span className="text-blue-600 text-2xl">${formatearPlata(totalVenta)}</span></div>
                            <input type="number" value={pagoRecibido} onChange={(e) => {setPagoRecibido(e.target.value); setMostrarVueltas(true)}} 
                                placeholder="¿Con cuánto pagan?" className="w-full p-3 rounded-xl border-2 border-blue-200 text-center" />
                            {mostrarVueltas && (
                                <div className={`p-3 rounded-xl text-center ${vueltas >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}`}>
                                    {vueltas >= 0 ? `Vueltas: $${formatearPlata(vueltas)}` : `Faltan: $${formatearPlata(Math.abs(vueltas))}`}
                                </div>
                            )}
                            <button onClick={confirmarVenta} disabled={carritoVenta.length === 0 || vueltas < 0}
                                className="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white shadow-lg disabled:grayscale">
                                ¡Vendido! 💰
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderStock = () => (
                <div className="p-4 max-w-2xl mx-auto">
                    <div className="bg-white p-6 rounded-3xl shadow-xl border-4 border-indigo-300">
                        <h2 className="text-3xl font-bold text-indigo-600 mb-6 text-center">❄️ Mi Nevera</h2>
                        <div className="space-y-3">
                            {inventario.map(h => (
                                <div key={h.id} className="p-4 bg-indigo-50 rounded-2xl border-2 border-indigo-100 flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <span className="text-4xl">{h.emoji}</span>
                                        <div>
                                            <p className="font-bold text-lg">{h.nombre}</p>
                                            <p className="text-sm text-gray-500">Venta: ${formatearPlata(h.precioVenta)}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs font-bold text-indigo-400 uppercase">Tienes</p>
                                        <p className={`text-3xl font-black ${h.stock < 5 ? 'text-red-500' : 'text-indigo-600'}`}>{h.stock}</p>
                                        <button onClick={() => {setSaborEditando(h.id); setPreciosEditados({precioVenta: h.precioVenta, costoCompra: h.costoCompra})}} className="text-xs bg-white px-2 py-1 rounded-full shadow-sm border border-indigo-200 mt-1">✏️ Editar</button>
                                    </div>
                                    {saborEditando === h.id && (
                                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                            <div className="bg-white p-6 rounded-3xl w-full max-w-xs">
                                                <h3 className="font-bold mb-4">Editar {h.nombre}</h3>
                                                <label className="block text-sm">Costo Compra:</label>
                                                <input type="number" className="w-full p-2 mb-3 border rounded-lg" value={preciosEditados.costoCompra} onChange={e => setPreciosEditados({...preciosEditados, costoCompra: e.target.value})} />
                                                <label className="block text-sm">Precio Venta:</label>
                                                <input type="number" className="w-full p-2 mb-4 border rounded-lg" value={preciosEditados.precioVenta} onChange={e => setPreciosEditados({...preciosEditados, precioVenta: e.target.value})} />
                                                <div className="flex gap-2">
                                                    <button onClick={() => guardarEdicion(h.id)} className="flex-1 bg-green-500 text-white py-2 rounded-xl">OK</button>
                                                    <button onClick={() => setSaborEditando(null)} className="flex-1 bg-gray-200 py-2 rounded-xl">X</button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderInformes = () => (
                <div className="p-4 max-w-4xl mx-auto">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-green-100 p-4 rounded-2xl border-2 border-green-300 text-center">
                            <p className="text-xs font-bold text-green-800">INGRESOS</p>
                            <p className="text-xl font-black text-green-600">${formatearPlata(metricas.ingresos)}</p>
                        </div>
                        <div className="bg-red-100 p-4 rounded-2xl border-2 border-red-300 text-center">
                            <p className="text-xs font-bold text-red-800">GASTOS</p>
                            <p className="text-xl font-black text-red-600">${formatearPlata(metricas.gastos)}</p>
                        </div>
                        <div className="bg-purple-100 p-4 rounded-2xl border-2 border-purple-300 text-center">
                            <p className="text-xs font-bold text-purple-800">RETIROS</p>
                            <p className="text-xl font-black text-purple-600">${formatearPlata(metricas.retiros)}</p>
                        </div>
                        <div className="bg-yellow-100 p-4 rounded-2xl border-4 border-yellow-400 text-center scale-105">
                            <p className="text-xs font-bold text-yellow-800">ALCANCÍA 🐖</p>
                            <p className="text-2xl font-black text-yellow-600">${formatearPlata(metricas.plataEnCaja)}</p>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-xl border-4 border-yellow-300">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-bold">🏆 Ranking de Sabores</h3>
                            <button onClick={borrarTodo} className="text-xs bg-red-50 text-red-400 p-2 rounded-lg hover:bg-red-100">Reiniciar Negocio 🗑️</button>
                        </div>
                        <div className="space-y-2">
                            {metricas.ventasPorProducto.sort((a,b) => b.cantidadVendida - a.cantidadVendida).map(p => (
                                <div key={p.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                                    <span>{p.emoji} {p.nombre}</span>
                                    <div className="text-right">
                                        <span className="font-bold">{p.cantidadVendida} vendidos</span>
                                        <p className="text-xs text-green-500">+${formatearPlata(p.ingresos)}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col pb-10">
                    <header className="bg-white p-4 shadow-md flex items-center justify-center gap-4 border-b-4 border-cyan-400 rounded-b-3xl mx-4 mt-2">
                        <span className="text-4xl animate-bounce">🍦</span>
                        <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-indigo-500">Paletas de Dilan</h1>
                    </header>

                    <nav className="flex justify-center gap-2 p-4 flex-wrap">
                        <button onClick={() => setPantallaActual('vender')} className={`px-4 py-2 rounded-full font-bold shadow-sm border-2 ${pantallaActual === 'vender' ? 'bg-cyan-500 text-white border-cyan-600' : 'bg-white text-cyan-500 border-cyan-200'}`}>💰 Vender</button>
                        <button onClick={() => setPantallaActual('comprar')} className={`px-4 py-2 rounded-full font-bold shadow-sm border-2 ${pantallaActual === 'comprar' ? 'bg-green-500 text-white border-green-600' : 'bg-white text-green-500 border-green-200'}`}>🚚 Comprar</button>
                        <button onClick={() => setPantallaActual('stock')} className={`px-4 py-2 rounded-full font-bold shadow-sm border-2 ${pantallaActual === 'stock' ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-indigo-500 border-indigo-200'}`}>❄️ Nevera</button>
                        <button onClick={() => setPantallaActual('informes')} className={`px-4 py-2 rounded-full font-bold shadow-sm border-2 ${pantallaActual === 'informes' ? 'bg-yellow-500 text-white border-yellow-600' : 'bg-white text-yellow-500 border-yellow-200'}`}>📊 Logros</button>
                    </nav>

                    <main className="flex-1">
                        {pantallaActual === 'vender' && renderVender()}
                        {pantallaActual === 'comprar' && (
                            <div className="flex flex-col lg:flex-row gap-6 p-4">
                                <div className="flex-1 bg-white p-6 rounded-3xl border-4 border-green-300">
                                    <h2 className="text-2xl font-bold text-green-600 mb-4 text-center">Abastecer</h2>
                                    <div className="grid grid-cols-2 gap-3">
                                        {inventario.map(h => (
                                            <button key={h.id} onClick={() => agregarAlCarritoCompra(h)} className="p-3 bg-green-50 rounded-xl border-2 border-green-100 flex flex-col items-center">
                                                <span className="text-3xl">{h.emoji}</span>
                                                <span className="text-xs font-bold">{h.nombre}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="w-full lg:w-80 bg-orange-50 p-6 rounded-3xl border-4 border-orange-300">
                                    <h3 className="font-bold text-center mb-4">Pedido al Proveedor</h3>
                                    {carritoCompra.map(i => (
                                        <div key={i.id} className="flex justify-between text-sm mb-2">
                                            <span>{i.nombre} x{i.cantidad}</span>
                                            <button onClick={() => quitarDelCarritoCompra(i.id)} className="text-red-500 font-bold">X</button>
                                        </div>
                                    ))}
                                    <div className="mt-4 pt-4 border-t font-bold flex justify-between"><span>Total:</span> <span>${formatearPlata(totalCompra)}</span></div>
                                    <button onClick={confirmarCompra} disabled={carritoCompra.length === 0} className="w-full mt-4 bg-orange-500 text-white py-3 rounded-xl disabled:grayscale">Pagar Pedido</button>
                                </div>
                            </div>
                        )}
                        {pantallaActual === 'stock' && renderStock()}
                        {pantallaActual === 'informes' && renderInformes()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
